services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: pdf-search-qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"   # REST / gRPC HTTP
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_data:
